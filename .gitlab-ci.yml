# Headless checks for the desktop client; native UI QA remains a separate step.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

stages: [check, review]

default:
  image: eclipse-temurin:25-jdk
  before_script:
    # The wrapper's pinned checksum is for ZIP; without unzip it downloads TAR.GZ.
    - apt-get update && apt-get install -y --no-install-recommends unzip
    - chmod +x mvnw
  cache:
    key: maven
    paths:
      - .m2/repository/
      - .m2/wrapper/

variables:
  MAVEN_USER_HOME: "$CI_PROJECT_DIR/.m2"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

java-lint:
  stage: check
  script:
    - >-
      ./mvnw -B -ntp org.apache.maven.plugins:maven-checkstyle-plugin:3.6.0:check
      -Dcheckstyle.config.location=ci/checkstyle.xml
      -Dcheckstyle.includeResources=false
  artifacts:
    when: always
    paths:
      - target/checkstyle-result.xml
    expire_in: 3 days

unit-tests:
  stage: check
  script:
    - ./mvnw -B -ntp clean test
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 3 days

# Adapted from course-materials/cicd-headless/PR-Agent-Qodo/gitlab-ci.yml.
# Setup and required secrets: docs/gitlab-pr-agent.md.
pr-agent-review:
  stage: review
  image:
    name: pragent/pr-agent:0.47.0@sha256:7d98954c29289846a08faf00aaea0f1f1375b1676cd8a2ed303e0af07010af7a
    entrypoint: [""]
  before_script: []
  cache: []
  variables:
    GIT_STRATEGY: none
    CONFIG__GIT_PROVIDER: gitlab
    CONFIG__FALLBACK_MODELS: '[]'
    CONFIG__RESTRICTED_MODE: 'true'
    CONFIG__PROPAGATE_TOOL_ERRORS: 'true'
    CONFIG__USE_REPO_SETTINGS_FILE: 'false'
    CONFIG__USE_GLOBAL_SETTINGS_FILE: 'false'
    CONFIG__REPO_CONTEXT_FILES: '[]'
    CONFIG__PUBLISH_OUTPUT: 'true'
    CONFIG__OUTPUT_RUN_DETAILS: 'true'
    CONFIG__REASONING_EFFORT: low
    PR_REVIEWER__PERSISTENT_COMMENT: 'true'
    PR_REVIEWER__FINAL_UPDATE_MESSAGE: 'false'
    PR_REVIEWER__INLINE_KEY_ISSUES: 'false'
    PR_REVIEWER__ENABLE_REVIEW_LABELS_EFFORT: 'false'
    PR_REVIEWER__ENABLE_REVIEW_LABELS_SECURITY: 'false'
    PR_REVIEWER__NUM_MAX_FINDINGS: '5'
    PR_REVIEWER__ENABLE_LARGE_PR_CHUNKING: 'true'
    PR_REVIEWER__MAX_NUMBER_OF_CALLS: '4'
    PR_REVIEWER__EXTRA_INSTRUCTIONS: |
      Review new correctness, security and error-handling defects in JFTP.
      Focus on Swing threading, FTP/FTPS, file operations and persisted profile compatibility.
      Give the failing scenario, source evidence and an actionable fix in concise English.
      Distinguish headless tests from native UI verification; never claim unexecuted checks passed.
  script:
    - |
      set -eu
      : "${REVIEW_API_KEY:?Set masked variable REVIEW_API_KEY (model endpoint API key)}"
      : "${GITLAB__PERSONAL_ACCESS_TOKEN:?Set masked variable GITLAB__PERSONAL_ACCESS_TOKEN (GitLab bot token)}"
      export OPENAI__KEY="$REVIEW_API_KEY"
      export OPENAI__API_BASE="${REVIEW_API_BASE:-https://openrouter.ai/api/v1}"
      MODEL="openai/${REVIEW_MODEL:-openai/gpt-6-luna}"
      export CONFIG__MODEL="$MODEL"
      export CONFIG__CUSTOM_MODEL_MAX_TOKENS="${REVIEW_MAX_TOKENS:-250000}"
      export CONFIG__MAX_MODEL_TOKENS="${REVIEW_MAX_TOKENS:-250000}"
      export CONFIG__NO_TEMPERATURE_MODELS="[\"$MODEL\"]"
      export CONFIG__ADDITIONAL_REASONING_EFFORT_MODELS="[\"$MODEL\"]"
      export GITLAB__URL="$CI_SERVER_URL"
      PR_URL="$CI_MERGE_REQUEST_PROJECT_URL/-/merge_requests/$CI_MERGE_REQUEST_IID"
      cd /app
      python -m pr_agent.cli --pr_url "$PR_URL" review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
      when: manual
    - when: never
  allow_failure: true
